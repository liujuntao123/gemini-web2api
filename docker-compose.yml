services:
  gemini-web2api:
    image: ${GEMINI_WEB2API_IMAGE:-ghcr.io/liujuntao123/gemini-web2api:latest}
    pull_policy: always
    container_name: gemini-web2api
    ports:
      - "${HOST_PORT:-18081}:8081"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data
    restart: unless-stopped
